services:
  mongo:
    image: mongo:7
    volumes:
      - ./data/mongo:/data/db
    ports:
      - "27017:27017"

  qdrant:
    image: qdrant/qdrant
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"

  backend:
    build: ./backend
    depends_on:
      - mongo
      - qdrant
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: mistral
      OLLAMA_EMBED_MODEL: nomic-embed-text

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
