<!DOCTYPE html>
<html lang="en" data-palette="indigo" data-typeset="geist" data-density="medium">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Apply the saved (or system) theme before first paint to avoid a
         light-mode flash. Mirrors initialTheme() in src/store/index.js. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('hindsite-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <title>Hindsite — look back, on purpose</title>
    <meta
      name="description"
      content="A private timeline for the moments that shaped you. Hindsite is a personal event timeline — log moments, attach photos, and chat with your own history."
    />
    <meta name="theme-color" content="#eef1f8" />

    <!-- Favicons. SVG for modern browsers, ICO for legacy + Google Safe
         Browsing reputation, plus apple-touch-icon for iOS home screen. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- OpenGraph / Twitter cards (chat previews, search results, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hindsite.app/" />
    <meta property="og:title" content="Hindsite — look back, on purpose" />
    <meta
      property="og:description"
      content="A private timeline for the moments that shaped you."
    />
    <meta property="og:image" content="https://hindsite.app/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hindsite — look back, on purpose" />
    <meta
      name="twitter:description"
      content="A private timeline for the moments that shaped you."
    />
    <meta name="twitter:image" content="https://hindsite.app/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
