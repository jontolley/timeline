server {
    listen 3000;
    server_name localhost;

    # iPhone photos routinely exceed nginx's 1 MB default.
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Older nginx images map .mjs to application/octet-stream, which the
    # browser refuses to execute as a module worker / script. Force a JS
    # MIME type on .mjs without disturbing the inherited mime.types map
    # (a bare `types { ... }` block here would replace it wholesale).
    location ~ \.mjs$ {
        types { } default_type text/javascript;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
